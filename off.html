<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor Rei · sin internet</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#1c1430">
<style>
:root{--bg:#17122b;--card:#231a40;--line:#3a2f63;--tx:#f3eefc;--mu:#a9a3b8;--ac:#ffd166}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:12px 12px 30px}
h1{font-size:22px;margin:4px 0 2px;color:var(--ac)}small,.mu{color:var(--mu)}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid #6b5aa8;background:#2a2045;color:var(--tx);padding:10px 14px}
.ex{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}
.ex b{flex:1}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
select{font:inherit;background:#2a2045;color:var(--tx);border:1px solid #6b5aa8;border-radius:10px;padding:8px}

.card.r1{border-color:#ff6b6b}.card.r2{border-color:#ffa94d}.card.r3{border-color:#ffd43b}.card.r4{border-color:#69db7c}.card.r5{border-color:#4dabf7}
.tag{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.q{font-weight:700;font-size:18px;margin:8px 0}.alt{display:block;width:100%;text-align:left;margin:6px 0;background:#1d1636;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.alt.ok{background:#1f5f3a;border-color:#69db7c}.alt.bad{background:#6b1f2a;border-color:#ff6b6b}
.ans p{margin:0 0 10px}.ans .k{color:var(--ac);font-weight:700}.dib{background:#fff5ec;border-radius:12px;margin:8px 0}.dib svg,.dib img{width:100%;height:auto;display:block}
.rate{position:sticky;bottom:0;z-index:5;display:flex;gap:6px;padding:10px;margin:10px -12px 0;background:#120d22;border-top:2px solid #ffd166;border-radius:14px 14px 0 0}
.rate button{flex:1;font-size:20px;font-weight:800;padding:10px 0}
.rate button:nth-child(1){color:#ff6b6b}.rate button:nth-child(2){color:#ffa94d}.rate button:nth-child(3){color:#ffd43b}.rate button:nth-child(4){color:#69db7c}.rate button:nth-child(5){color:#4dabf7}
.msg{background:#2a2045;border:1px solid #6b5aa8;border-radius:12px;padding:10px;margin:10px 0}
.nav{display:flex;gap:8px;margin:10px 0}.nav button{flex:1}
.pad{background:var(--card);border:2px solid #4dabf7;border-radius:16px;padding:10px;margin:12px 0}
.pad.dirty{border-color:#ffa94d}.pad h3{margin:0 0 6px;font-size:15px;color:#9ad0ff}.pad canvas{width:100%;background:#fff;border-radius:10px;touch-action:pan-y;display:block}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.tools button{padding:6px 10px;font-size:14px}.tools button.on{outline:2px solid #ffd166}
.pad textarea{width:100%;min-height:90px;margin-top:8px;background:#1d1636;color:var(--tx);border:2px solid #ffd166;border-radius:10px;padding:8px;font:inherit}
.pst{font-size:13px;color:var(--mu)}.nbe{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.altpk{background:#00e5c0;color:#00302a;font-weight:800;border-radius:5px;padding:1px 5px;box-shadow:0 0 0 2px #00e5c0;-webkit-box-decoration-break:clone;box-decoration-break:clone}</style></head><body>
<div id="app"></div>
<script>
const DAY=86400000,today=()=>Math.floor(Date.now()/DAY);
const SRS={1:{n:3},2:{n:8},3:{n:10,d:1,m:1.2},4:{n:50,d:2,m:2.5},5:{n:100,d:4,m:3.5}};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db;function idb(){return new Promise((ok,ko)=>{const r=indexedDB.open('mazo_off',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv')};r.onsuccess=()=>{db=r.result;ok()};r.onerror=()=>ko(r.error)})}
function get(k){return new Promise(ok=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>ok(t.result);t.onerror=()=>ok(undefined)})}
function put(k,v){return new Promise(ok=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ok()})}
async function exams(){return (await get('exams'))||{}}
async function prog(ex){return (await get('p:'+ex))||{}}
async function pend(){return (await get('pend'))||{}}

/* ---------- recepción desde la app con internet ---------- */
const RECV=/recv=1/.test(location.search);
let Q=Promise.resolve();window.addEventListener('message',e=>{Q=Q.then(()=>H(e)).catch(()=>{})});
function stl(h){let s=$('#st');if(!s){s=document.createElement('div');s.id='st';s.className='msg';$('#app').prepend(s)}s.innerHTML+=h}

 async function H(e){const m=e.data;if(!m||m.mz===undefined)return;
  if(m.mz==='hello'){e.source.postMessage({mz:'ready',pend:await pend(),pendpad:(await get('pendpad'))||{},saved:Object.keys(await exams())},'*');stl('<div>☁️ Sincronizando con tu cuenta…</div>');return}
  if(m.mz==='deck'){const E=await exams();E[m.ex]={name:m.name,n:m.data.c.length,at:Date.now()};await put('d:'+m.ex,{data:m.data,dib:m.dib});
   const P=await prog(m.ex),R=m.prog||{};for(const k in R){if(!P[k]||(R[k][3]||0)>(P[k][3]||0))P[k]=R[k]}await put('p:'+m.ex,P);await put('exams',E);
   const PP=(await get('pendpad'))||{};for(const n in (m.pads||{})){const id=m.ex+'|'+n;if(PP[id])continue;try{await put('pad:'+id,{d:JSON.parse(m.pads[n]),ts:0})}catch(er){}}
   stl('<div>✅ '+esc(m.name)+' ('+m.data.c.length+' tarjetas)</div>')}
  if(m.mz==='pct'){let b=$('#pg');if(!b){$('#app').insertAdjacentHTML('beforeend','<div class="msg"><div id="pgt"></div><div style="height:14px;background:#120d22;border-radius:8px;overflow:hidden;margin-top:6px"><div id="pg" style="height:100%;width:0;background:linear-gradient(90deg,#69db7c,#ffd166);transition:width .3s"></div></div></div>');b=$('#pg')}b.style.width=m.p+'%';$('#pgt').textContent='Guardando: '+m.p+'% · '+m.t;return}
  if(m.mz==='list'){const E=await exams();for(const k in E)if(m.ids.indexOf(k)<0){delete E[k];await put('d:'+k,null)}await put('exams',E)}
  if(m.mz==='synced'){await put('pend',{});await put('pendpad',{});stl('<div>☁️ Tus calificaciones, pizarras y notas hechas sin internet se subieron a tu cuenta.</div>')}
  if(m.mz==='done'){const b=$('#pg');if(b){b.style.width='100%';$('#pgt').textContent='Guardando: 100%'}stl('<div class="msg"><b>Listo.</b> Ya podés estudiar sin internet desde el ícono Doctor Rei → «📴 Estudiar sin internet». Podés cerrar esta pestaña.</div>');if(!RECV&&!D)setTimeout(home,800)}
  if(m.mz==='err'){stl('<div>⚠️ '+esc(m.t)+'</div>')}
 }
 if(RECV)(async()=>{await idb();$('#app').innerHTML='<h1>📴 Guardando para usar sin internet…</h1><div id="st" class="msg">No cierres esta pestaña hasta que diga «Listo».</div>';
  const op=window.opener;if(!op){$('#st').textContent='Abrí esta página desde el botón «⬇️ Sin internet» de la app.';return}
  op.postMessage({mz:'ready',pend:await pend(),pendpad:(await get('pendpad'))||{},saved:Object.keys(await exams())},'*')})();
else (async()=>{await idb();home()})();

/* ---------- estudio sin internet ---------- */
let EX,D,DIB,P,list=[],i=0,back=false,mode='today',TOP='',chosen=null;
async function home(){const E=await exams(),pd=await pend();const np=Object.values(pd).reduce((a,o)=>a+Object.keys(o).length,0),npp=Object.keys((await get('pendpad'))||{}).length;
 let h='<h1>📴 Estudiar sin internet</h1><div class="mu">Exámenes guardados en este dispositivo</div>';
 const ks=Object.keys(E);if(!ks.length)h+='<div class="msg">Todavía no guardaste ningún examen. Con internet, abrí la app y tocá <b>«⬇️ Sin internet»</b> en la lista de exámenes.</div>';
 ks.forEach(k=>{h+='<div class="ex"><b>'+esc(E[k].name)+'<br><small>'+E[k].n+' tarjetas · guardado '+new Date(E[k].at).toLocaleDateString()+'</small></b><button data-ex="'+esc(k)+'">Estudiar</button></div>'});
 if(np||npp)h+='<div class="msg">☁️ Tenés <b>'+np+'</b> calificaciones y <b>'+npp+'</b> pizarras/notas hechas sin internet. Se suben a tu cuenta la próxima vez que, con internet, toques «⬇️ Sin internet» en la app.</div>';
 h+='<p><button id="sy" style="background:#1f5f3a;border-color:#69db7c">☁️ Sincronizar con mi cuenta</button> <button onclick="location.href=\'./\'">← Volver al inicio</button></p><div class="mu" style="font-size:13px">Sincronizar (necesita internet): sube a tu cuenta de Google tus notas 1-5, pizarras y notas hechas sin internet, y actualiza los exámenes guardados. Así seguís en la PC o la tablet donde quedaste.</div>';
 $('#app').innerHTML=h;document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>open_(b.dataset.ex));$('#sy').onclick=()=>{if(!navigator.onLine){alert('Necesitás internet para sincronizar.');return}window.open(APPU+'?sync=1','_blank')}}
const APPU='https://script.google.com/macros/s/AKfycbwdZ4I3V_RpnAvIQ0BQ-20xQordBOhQi4AZGO3jZM0Q69O2HsUX6yc0us8qKSXuKN308g/exec';
async function open_(ex){EX=ex;TOP='';const d=await get('d:'+ex);D=d.data;DIB=d.dib||[];P=await prog(ex);build();}
function idOf(n){return EX+'|'+n}
function build(){const td=today();list=[];D.c.forEach((c,n)=>{if(c.del)return;if(TOP&&c.t!==TOP)return;const p=P[idOf(n)];if(mode==='all'||mode==='asc'||!p||p[2]<=td||(mode==='r1'&&p[0]<=2))list.push(n)});
 if(mode==='r1')list=list.filter(n=>P[idOf(n)]&&P[idOf(n)][0]<=2);if(mode==='asc'){const po={};list.forEach((n,j)=>po[n]=j);list.sort((x,y)=>{const px=P[idOf(x)],py=P[idOf(y)];return ((px?px[0]:0)-(py?py[0]:0))||po[x]-po[y]})}i=0;back=false;show()}
function svgFor(c){if(!c.s||!D.k||D.k[c.s]===undefined)return '';const f=DIB[D.k[c.s]];return f&&f[c.s]?f[c.s]:''}
function parseQ(q){const L=q.split('\n'),alts=[],st=[];L.forEach(l=>{const m=l.match(/^\s*([a-hA-H]|[1-9])[).]\s+(.*)/);if(m)alts.push({k:m[1].toLowerCase(),t:l.trim()});else if(!alts.length)st.push(l)});if(alts.length<2){const P=q.split(/\s(?=[a-hA-H][).]\s)/);if(P.length>2&&P.slice(1).every((x,j)=>x.trim()[0].toLowerCase()==='abcdefgh'[j]))return {st:P[0],alts:P.slice(1).map(x=>({k:x.trim()[0].toLowerCase(),t:x.trim()}))}}return {st:st.join('\n'),alts}}
function pkHL(html,alts){const pats=[];alts.forEach(a=>{const m=a.t.match(/^\s*([A-Za-z0-9]{1,2})\s*[).\-:]\s*(.+?)\s*\.?\s*$/);if(!m||m[2].length<2)return;const t=esc(m[2]).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');pats.push('\\(?'+m[1]+'\\s*[).\\-:]\\s*'+t+'\\.?')});if(!pats.length)return html;pats.sort((p,q)=>q.length-p.length);const re=new RegExp('('+pats.join('|')+')','gi');return html.replace(/>([^<]+)</g,(w,x)=>'>'+x.replace(re,'<span class="altpk">$1</span>')+'<')}
function keyOf(a){const m=a.split('\n')[0].match(/^Respuesta correcta:\s*([a-eA-E1-9])[).]/);return m?m[1].toLowerCase():null}
function guard(f){return function(){if(PADD&&PADD.dirty()&&!confirm('¿Querés salir sin guardar la pizarra y las notas? (Cancelar = volver y guardar)'))return;f.apply(this,arguments)}}
function show(){const E=document.getElementById('app');PADD=null;
 if(!list.length){E.innerHTML='<h1>🎉 No queda nada para hoy</h1><div class="nav"><button id="all">▶ Seguir con «Todas»</button><button id="hm">← Exámenes</button>'+(TOP?'<button id="tt">📚 Todos los temas</button>':'')+'</div>';if($('#tt'))$('#tt').onclick=()=>{TOP='';build()};$('#all').onclick=()=>{mode='all';$('#app');build()};$('#hm').onclick=home;document.querySelector('.rate')&&document.querySelector('.rate').remove();return}
 const n=list[i],c=D.c[n],p=P[idOf(n)],pq=parseQ(c.q),key=keyOf(c.a);
 let h='<div class="top"><button id="hm">← Exámenes</button><select id="md"><option value="today">Repaso de hoy</option><option value="all">Todas</option><option value="r1">Solo nota 1-2</option><option value="asc">Sin ver → 1 → 2 → 3 → 4 → 5</option></select>'+(function(){const ts=(D.t&&D.t.length?D.t:[...new Set(D.c.filter(c=>!c.del).map(c=>c.t).filter(Boolean))]).slice().sort();return '<select id="tp"><option value="">Todos los temas</option>'+ts.map(t=>'<option'+(t===TOP?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select>'})()+'<span class="mu">Tarjeta '+(i+1)+' de '+list.length+'</span></div>';
 h+='<div class="card'+(p?' r'+p[0]:'')+'" id="cd"><div class="tag">'+esc(c.t||'')+(p?' · última nota: '+p[0]:'')+'</div>';
 if(!back){h+='<div class="q">'+esc(pq.st).replace(/\n/g,'<br>')+'</div>';pq.alts.forEach(a=>{h+='<button class="alt" data-k="'+a.k+'">'+esc(a.t)+'</button>'});if(!pq.alts.length)h+='';h+='<p class="mu">Tocá la tarjeta para ver la respuesta</p>'}
 else{const sv=svgFor(c);
  const ps=c.a.split(/\n\s*\n|\n/);h+=pkHL('<div class="ans">'+ps.map((t,j)=>'<p'+(j===0?' class="k"':'')+'>'+esc(t)+'</p>').join('')+'</div>',pq.alts);if(sv)h+='<div class="dib"><img alt="" src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(sv)+'"></div>';h+='<p class="mu">Ahora calificá de 1 a 5 abajo</p>'}
 h+='</div>'+(back?'<div id="padw"></div>':'')+'<div class="nav"><button id="pv">◀ Anterior</button><button id="nx">Siguiente ▶</button></div>';
 E.innerHTML=h;$('#md').value=mode;$('#md').onchange=e=>{mode=e.target.value;build()};$('#tp').onchange=e=>{TOP=e.target.value;build()};$('#hm').onclick=guard(()=>{rm();home()});const top=E.querySelector('.top');const nb=document.createElement('button');nb.textContent='📚 Cuaderno';nb.onclick=guard(()=>{rm();cuaderno()});top.insertBefore(nb,top.children[1]);
 $('#pv').onclick=guard(()=>{if(i>0){i--;back=false;show()}});$('#nx').onclick=guard(()=>{if(i<list.length-1){i++;back=false;show()}});
 $('#cd').onclick=guard(e=>{if(e.target.closest('.alt'))return;back=!back;show()});if(back)makePad($('#padw'),idOf(n)).then(x=>PADD=x);
 document.querySelectorAll('.alt').forEach(b=>b.onclick=e=>{e.stopPropagation();if(chosen!==null||!key)return;chosen=b.dataset.k;b.classList.add(chosen===key?'ok':'bad');const g=document.querySelector('.alt[data-k="'+key+'"]');if(g)g.classList.add('ok');setTimeout(()=>{chosen=null;back=true;show()},1200)});
 rm();if(back){const r=document.createElement('div');r.className='rate';r.innerHTML=[1,2,3,4,5].map(x=>'<button data-r="'+x+'">'+x+'</button>').join('');const nv=E.querySelector('.nav');(document.getElementById('padw')||nv).insertAdjacentElement('beforebegin',r);r.querySelectorAll('button').forEach(b=>b.onclick=guard(()=>rate(+b.dataset.r)))}
 window.scrollTo(0,0)}
function rm(){const r=document.querySelector('.rate');if(r)r.remove()}
async function rate(r){const n=list[i],id=idOf(n),p=P[id]||[0,0,0,0];let iv=p[1];const S=SRS[r];if(r<=3)iv=0;else iv=Math.max(S.d,Math.round(iv*S.m));
 const en=[r,iv,today()+iv,Date.now()];P[id]=en;await put('p:'+EX,P);const pd=await pend();(pd[EX]=pd[EX]||{})[id]=en;await put('pend',pd);
 list.splice(i,1);if(r<=3){const pos=Math.min(list.length,i+S.n);list.splice(pos,0,n)}if(i>=list.length)i=Math.max(0,list.length-1);back=false;show()}
document.addEventListener('keydown',e=>{if(!D||RECV||/TEXTAREA|SELECT/.test((e.target||{}).tagName))return;if(PADD&&PADD.dirty())return;if(e.key===' '){e.preventDefault();back=!back;show()}else if(/^[1-5]$/.test(e.key)&&list.length)rate(+e.key)});
let PADD=null;
async function makePad(box,id){const rec=(await get('pad:'+id))||{d:{s:[],t:''}};let data=JSON.parse(JSON.stringify(rec.d||{s:[],t:''}));if(!data.s)data.s=[];if(typeof data.t!=='string')data.t='';let dirty=false;
 box.innerHTML='<div class="pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>📝 Mi pizarra y notas</h3><button class="sv">💾 Guardar</button></div><div class="pst">✓ guardado en este dispositivo</div>'+
 '<div class="tools"><button data-c="#111111" class="on">⚫</button><button data-c="#1c7ed6">🔵</button><button data-c="#e03131">🔴</button><button data-c="#2f9e44">🟢</button><button data-w="2" class="on">fino</button><button data-w="5">grueso</button><button class="er">borrador</button><button class="un">↶ deshacer</button><button class="cl">🗑 borrar todo</button></div>'+
 '<canvas></canvas><div class="mu" style="font-size:12px">Se dibuja con el lápiz; con el dedo se desplaza.</div><textarea placeholder="Notas con el teclado…"></textarea></div>';
 const pd=box.querySelector('.pad'),cv=box.querySelector('canvas'),ctx=cv.getContext('2d'),tx=box.querySelector('textarea'),st=box.querySelector('.pst');tx.value=data.t;
 let col='#111111',w=2,er=false,cur=null;
 function strk(s){if(!s.p.length)return;const W=cv.width;ctx.globalCompositeOperation=s.e?'destination-out':'source-over';ctx.strokeStyle=s.c;ctx.lineWidth=(s.e?s.w*4+6:s.w)*W/600;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(s.p[0][0]*W,s.p[0][1]*W);for(const q of s.p)ctx.lineTo(q[0]*W,q[1]*W);if(s.p.length===1)ctx.lineTo(s.p[0][0]*W+.1,s.p[0][1]*W);ctx.stroke();ctx.globalCompositeOperation='source-over'}
 function draw(){ctx.clearRect(0,0,cv.width,cv.height);data.s.forEach(strk);if(cur)strk(cur)}
 function size(){const r=cv.getBoundingClientRect();if(!r.width)return;const d=devicePixelRatio||1;cv.width=Math.round(r.width*d);cv.height=Math.round(r.width*.62*d);cv.style.height=(r.width*.62)+'px';draw()}
 function mark(){dirty=true;pd.classList.add('dirty');st.textContent='● Cambios sin guardar'}
 const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.width]};
 cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='pen'&&e.pointerType!=='mouse')return;e.preventDefault();cv.setPointerCapture(e.pointerId);cur={p:[pt(e)],c:col,w:w,e:(er||e.button===5||(e.buttons&32))?1:0};draw()});
 cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();((e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e]).forEach(x=>cur.p.push(pt(x)));draw()});
 const end=()=>{if(!cur)return;data.s.push(cur);cur=null;mark();draw()};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
 box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{col=b.dataset.c;er=false;box.querySelectorAll('[data-c],.er').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
 box.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{w=+b.dataset.w;box.querySelectorAll('[data-w]').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
 box.querySelector('.er').onclick=e=>{er=!er;e.target.classList.toggle('on',er)};
 box.querySelector('.un').onclick=()=>{if(data.s.length){data.s.pop();mark();draw()}};
 box.querySelector('.cl').onclick=()=>{if(data.s.length&&confirm('¿Borrar toda la pizarra?')){data.s=[];mark();draw()}};
 tx.oninput=()=>{data.t=tx.value;mark()};
 async function save(){const ts=Date.now();await put('pad:'+id,{d:data,ts:ts});const PP=(await get('pendpad'))||{};PP[id]={s:JSON.stringify(data),ts:ts};await put('pendpad',PP);dirty=false;pd.classList.remove('dirty');st.textContent='✓ guardado en este dispositivo (se sube a tu cuenta al sincronizar)'}
 box.querySelector('.sv').onclick=save;requestAnimationFrame(size);addEventListener('resize',size);
 return {dirty:()=>dirty,save:save}}
async function cuaderno(){const E=$('#app');E.innerHTML='<div class="top"><button id="bk">← Volver a las tarjetas</button></div><h1>📚 Cuaderno</h1><div class="mu">Todas las tarjetas de este examen con pizarra o notas, en orden.</div><div id="nbl"></div>';
 $('#bk').onclick=()=>{if(nbPads.some(x=>x.dirty())&&!confirm('Hay cambios sin guardar. ¿Salir igual?'))return;show()};const L=$('#nbl');let any=0;nbPads=[];
